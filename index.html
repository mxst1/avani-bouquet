<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#24262f">
<title>For Avani ♡</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#262832}body{overflow:hidden;font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;color:#d8d5dc}.window{height:100dvh;display:flex;flex-direction:column;background:#2b2d37}.bar{height:34px;flex:none;position:relative;display:flex;align-items:center;justify-content:center;background:#3b3d46;color:#d9d8df;font-size:12px;letter-spacing:.02em}.dots{position:absolute;left:13px;display:flex;gap:7px}.dots i{width:10px;height:10px;border-radius:50%;background:#f37369}.dots i:nth-child(2){background:#f5c15b}.dots i:nth-child(3){background:#72c879}.stage{min-height:0;flex:1;display:flex;align-items:center;justify-content:center;position:relative}.stage canvas{display:block;width:min(100vw,calc((100dvh - 66px)*.9));max-height:100%;object-fit:contain}.footer{height:32px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 15px;color:#a6a3ae;font-size:11px}.footer .dedication{color:#d9a6b9}.footer button{font:inherit;color:#aaa7b0;border:0;background:none;padding:7px 0 7px 12px;cursor:pointer}.footer button:hover,.footer button:focus-visible{color:#f4c2d2}.footer button:focus-visible{outline:1px solid #f4c2d2;outline-offset:2px}@media(max-width:500px){.footer{font-size:10px}.bar{height:32px}}
</style>
</head>
<body><main class="window"><div class="bar"><span class="dots" aria-hidden="true"><i></i><i></i><i></i></span><span>Terminal</span></div><div class="stage"><canvas id="art" width="720" height="800" role="img" aria-label="A slowly rotating bouquet of pink lilies and flowers, made from colorful text characters"></canvas></div><div class="footer"><span class="dedication">for Avani ♡</span><button id="replay" aria-label="Restart bouquet rotation">replay ↺</button></div></main>
<script>const canvas=document.querySelector("#art"),ctx=canvas.getContext("2d");ctx.font="18px monospace";ctx.fillStyle="#f5b7cd";ctx.textAlign="center";ctx.fillText("for Avani ♡",360,390);</script></body></html>
